{{define "content"}}
<h1>{{.Pool.Name}}</h1>
<form method="post" action="/pools/{{.Pool.ID}}" class="form">
  <label>Name<input name="name" value="{{.Pool.Name}}" required></label>
  <label class="check"><input type="checkbox" name="enabled" {{if .Pool.Enabled}}checked{{end}}> Enabled</label>
  <label>Labels<input name="labels" value="{{labels .Pool.Labels}}" required></label>
  <label>Max machines<input name="max_instances" type="number" min="1" value="{{.Pool.MaxInstances}}"></label>
  <label>Min idle<input name="min_idle" type="number" min="0" value="{{.Pool.MinIdle}}"></label>
  <label>Job timeout (s)<input name="job_timeout_sec" type="number" min="60" value="{{.Pool.JobTimeoutSec}}"></label>
  <label>Max lifetime (s)<input name="max_lifetime_sec" type="number" min="120" value="{{.Pool.MaxLifetimeSec}}"></label>
  <label>Container image<input name="container_image" value="{{.Pool.ContainerImage}}"></label>
  <label class="check"><input type="checkbox" name="public_ipv4" {{if .Pool.PublicIPv4}}checked{{end}}> Public IPv4</label>
  <button>Save</button>
  <a class="ghost danger" href="/pools/{{.Pool.ID}}/delete">Delete pool</a>
</form>
{{end}}
