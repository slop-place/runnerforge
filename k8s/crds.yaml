# runnerforge custom resource definitions.
#
# Applying these lets a cluster hold the configuration: clouds, forges and
# pools become objects that live alongside the rest of your manifests, and
# runnerforge reconciles them into its own database when started with -k8s.
#
# Credentials are never in these objects. Each resource points at a Secret, so
# the manifests stay committable.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clouds.runnerforge.slop.place
spec:
  group: runnerforge.slop.place
  scope: Namespaced
  names:
    kind: Cloud
    listKind: CloudList
    plural: clouds
    singular: cloud
    shortNames: [rfc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Driver
          type: string
          jsonPath: .spec.driver
        - name: Sizes
          type: integer
          jsonPath: .status.sizes
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [driver]
              properties:
                driver:
                  type: string
                  description: >-
                    openstack for OVHcloud and any other OpenStack, or docker
                    for local containers.
                enabled:
                  type: boolean
                  default: true
                  description: >-
                    A disabled cloud provisions nothing but is still swept by
                    the reaper, so disabling it cannot strand running machines.
                settings:
                  type: object
                  additionalProperties: {type: string}
                  description: >-
                    Non-secret driver settings. Which keys apply depends on the
                    driver; the deployment's UI lists them.
                secretRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
                  description: >-
                    A Secret holding the driver's credential keys. Credentials
                    are never written into this object.
                sizes:
                  type: array
                  description: >-
                    What each size name means on this account. Pools ask for a
                    name, so large can be a c3-8 here and a cpx41 elsewhere.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      spec:
                        type: object
                        additionalProperties: {type: string}
                      vcpus: {type: integer}
                      memoryMB: {type: integer}
                      diskGB: {type: integer}
                      hourlyUSD: {type: number}
                images:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      spec:
                        type: object
                        additionalProperties: {type: string}
                      username: {type: string}
                      preinstalledDocker: {type: boolean}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                id: {type: integer}
                sizes: {type: integer}
                images: {type: integer}
                observedGeneration: {type: integer}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forges.runnerforge.slop.place
spec:
  group: runnerforge.slop.place
  scope: Namespaced
  names:
    kind: Forge
    listKind: ForgeList
    plural: forges
    singular: forge
    shortNames: [rff]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [github, gitlab, forgejo]
                enabled:
                  type: boolean
                  default: true
                settings:
                  type: object
                  additionalProperties: {type: string}
                  description: >-
                    Connection settings: the instance URL, the scope, and what
                    that scope names. The deployment's UI lists them per forge.
                secretRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
                  description: A Secret holding the API token.
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                id: {type: integer}
                observedGeneration: {type: integer}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pools.runnerforge.slop.place
spec:
  group: runnerforge.slop.place
  scope: Namespaced
  names:
    kind: Pool
    listKind: PoolList
    plural: pools
    singular: pool
    shortNames: [rfp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Forge
          type: string
          jsonPath: .spec.forgeRef
        - name: Cloud
          type: string
          jsonPath: .spec.cloudRef
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Machines
          type: integer
          jsonPath: .status.machines
        - name: Status
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [forgeRef, cloudRef, size, labels]
              properties:
                enabled:
                  type: boolean
                  default: true
                forgeRef:
                  type: string
                  description: The name of a Forge object in this namespace.
                cloudRef:
                  type: string
                  description: The name of a Cloud object in this namespace.
                size:
                  type: string
                  description: A size name from that cloud's catalogue.
                image:
                  type: string
                  description: An image name from that cloud's catalogue.
                labels:
                  type: array
                  minItems: 1
                  items: {type: string}
                  description: >-
                    A job is served by this pool when the pool offers every
                    label the job asks for.
                minIdle:
                  type: integer
                  default: 0
                  minimum: 0
                  description: Warm machines kept waiting. Costs money, buys latency.
                maxInstances:
                  type: integer
                  default: 5
                  minimum: 1
                  description: >-
                    A safety ceiling as much as a scaling knob. Keep it at or
                    below the cloud account's quota.
                jobTimeoutSeconds:
                  type: integer
                  default: 3600
                  minimum: 60
                maxLifetimeSeconds:
                  type: integer
                  default: 7200
                  minimum: 120
                  description: >-
                    The reaper's hard ceiling. Must exceed the job timeout, or
                    machines are destroyed mid-job.
                containerImage: {type: string}
                publicIPv4:
                  type: boolean
                  default: true
                allowSSHFrom:
                  type: array
                  items: {type: string}
                  description: >-
                    CIDRs allowed to reach port 22. Empty means no inbound SSH,
                    which is right for every forge except the GitLab
                    docker-autoscaler path.
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                id: {type: integer}
                machines: {type: integer}
                observedGeneration: {type: integer}
